<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spending Tracker</title>

<!-- font: the closest free match to the "i was created to create." card -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<!-- install as an app on the phone -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#eeeeec">
<link rel="apple-touch-icon" href="apple-touch-icon.jpg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spending">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>

<!-- intro screen: shows first, then fades away -->
<div id="splash" aria-hidden="true">
  <h1 class="splash-logo"><span>My</span><span>Spending</span><span>Tracker</span></h1>
</div>

<main>
  <div id="loading" class="empty" style="margin-top:30vh">Loading…</div>

  <!-- login: only you, only once per phone -->
  <div id="loginView" class="loginwrap" hidden>
    <h1>My Spending Tracker</h1>
    <form id="loginForm" class="card">
      <h2>Log in</h2>
      <input id="email" type="email" autocomplete="username" placeholder="Email" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <div class="loginerr" id="loginErr"></div>
      <button type="submit" id="loginBtn" style="width:100%">Log in</button>
    </form>
  </div>

  <div id="appView" hidden>
    <!-- profile photo (tap it to upload) + logo -->
    <header class="topbar">
      <button type="button" class="avatar" id="avatarBtn" aria-label="Change profile photo" title="Change profile photo">
        <img id="avatarImg" alt="Profile photo" hidden>
        <span class="avatar-ph" id="avatarPh">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>
        </span>
        <span class="avatar-plus" id="avatarPlus" aria-hidden="true">+</span>
      </button>
      <h1>My Spending Tracker</h1>
      <input type="file" id="photoInput" accept="image/*" hidden>
    </header>

    <div class="monthnav">
      <button class="ghost" id="prevM" aria-label="Previous month">‹</button>
      <span class="name" id="monthName"></span>
      <button class="ghost" id="nextM" aria-label="Next month">›</button>
    </div>
    <div class="status" id="status"></div>

    <section class="card hero" id="hero"></section>

    <section class="card" id="addSpendCard">
      <h2>Add spending</h2>
      <div class="row">
        <input id="spNote" type="text" placeholder="Item Name">
        <input id="spAmount" type="number" inputmode="decimal" placeholder="Price (RM)">
      </div>
      <button id="spAdd">Add</button>
    </section>

    <section class="card">
      <h2 id="spTitle">Bought</h2>
      <div id="spList"></div>
    </section>

    <section class="card">
      <h2>Wish List</h2>
      <div id="addWishForm">
        <div class="row">
          <input id="wName" type="text" placeholder="Item Name">
          <input id="wPrice" type="number" inputmode="decimal" placeholder="Price (RM)">
        </div>
        <button id="wAdd">Add to wishlist</button>
      </div>
      <div id="wList"></div>
    </section>

    <section class="card" id="setupCard">
      <details>
        <summary id="setupTitle">Monthly Budget Setup</summary>
        <div style="margin-top:10px">
          <label class="small">Monthly allowance (RM)</label>
          <input id="allowance" type="number" inputmode="decimal">
          <label class="small">Savings per month (RM)</label>
          <input id="savings" type="number" inputmode="decimal">
          <label class="small">Food Spending per month (RM)</label>
          <input id="foods" type="number" inputmode="decimal">
          <button id="saveSetup">Save</button>
        </div>
      </details>
    </section>

    <section class="nocard">
      <div class="small" id="acct"></div>
      <button class="ghost" id="logout">Log out</button>
    </section>

  </div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
